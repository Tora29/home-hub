version: 2
updates:
  # 個人で見られる量に抑えるため月1回にする。脆弱性の修正（security updates）は頻度に関係なくすぐ届く
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
      timezone: 'Asia/Tokyo'
    open-pull-requests-limit: 10
    # パッチ・マイナーはまとめて 1 PR、メジャーはグループ外 = パッケージごとの個別 PR
    # （1 つのメジャー更新で CI が落ちてグループ全体が止まるのを防ぐ）
    groups:
      dev-dependencies:
        dependency-type: 'development'
        update-types: ['minor', 'patch']
      production-dependencies:
        dependency-type: 'production'
        update-types: ['minor', 'patch']
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    # 依存の peer 制約で保留中のメジャー更新は PR 自体を作らせない（閉じても次の版で再提案されるため）。
    # 理由の一覧は .claude/rules/security.md「保留中のメジャー更新」。制約が解けたらここから外す
    ignore:
      # @cloudflare/vitest-pool-workers（integration テスト）が vitest ^4.1 のみ対応
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/browser-playwright'
        update-types: ['version-update:semver-major']
      # @sveltejs/kit / svelte-check / typescript-eslint が TypeScript 7 未対応
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # 型は engines.node（>=22）の最小版に合わせる
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
      timezone: 'Asia/Tokyo'
    commit-message:
      prefix: 'chore(ci)'

  # Cloudflare プロバイダ（.terraform.lock.hcl）の更新。
  # ./modules/d1・./modules/pages は main.tf から参照される local module として自動で読まれるため、
  # directory は lock ファイルのある /terraform だけでよい（バージョン制約は main.tf 側にのみある）
  - package-ecosystem: 'terraform'
    directory: '/terraform'
    schedule:
      interval: 'monthly'
      timezone: 'Asia/Tokyo'
    # minor・patch は 1 PR にまとめる。major はグループ外 = 個別 PR
    # （v4→v5 のようにリソース定義の書き換えが必要になることがあるため、個別に plan を確認する）
    groups:
      terraform-providers:
        update-types: ['minor', 'patch']
    commit-message:
      prefix: 'chore(deps)'
